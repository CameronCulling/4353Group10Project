<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Service Management</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">

    <h1>Service Management</h1>

    <nav>
        <a href="admin.html">Dashboard</a>
        <a href="services.html">Services</a>
        <a href="../Suyash_QueueSmart_Auth/Suyash_QueueSmart_Auth/index.html">Sign out</a>
    </nav>

</header>

<main class="container">

    <section class="page-header">

        <div>
            <h2>Services</h2>
            <p>Create and manage available services.</p>
        </div>

    </section>

    <section class="card">

        <h2 id="formTitle">Create Service</h2>

        <form id="serviceForm">

            <div class="form-group">

                <label for="serviceName">
                    Service Name *
                </label>

                <input
                    type="text"
                    id="serviceName"
                    maxlength="100"
                    required
                    placeholder="e.g. Passport Application"
                >

                <small>Maximum 100 characters.</small>

            </div>


            <div class="form-group">

                <label for="description">
                    Description *
                </label>

                <textarea
                    id="description"
                    required
                    placeholder="Describe this service..."
                ></textarea>

            </div>


            <div class="form-group">

                <label for="duration">
                    Expected Duration (minutes) *
                </label>

                <input
                    type="number"
                    id="duration"
                    min="1"
                    required
                    placeholder="30"
                >

            </div>


            <div class="form-group">

                <label for="priority">
                    Priority Level
                </label>

                <select id="priority">

                    <option value="low">
                        Low
                    </option>

                    <option value="medium" selected>
                        Medium
                    </option>

                    <option value="high">
                        High
                    </option>

                </select>

            </div>


            <div class="form-actions">

                <button
                    type="submit"
                    class="button primary"
                >
                    Save Service
                </button>

                <button
                    type="button"
                    class="button secondary"
                    onclick="clearForm()"
                >
                    Clear
                </button>

            </div>

        </form>

    </section>


    <section class="card">

        <h2>Existing Services</h2>

        <div id="serviceTable"></div>

    </section>

</main>

<script src="script.js"></script>

</body>
</html>
