<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Queue Management</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="navbar">

    <h1>Queue Management</h1>

    <nav>
        <a href="index.html">Dashboard</a>
        <a href="services.html">Services</a>
    </nav>

</header>


<main class="container">

    <section class="page-header">

        <div>

            <h2>Manage Queue</h2>

            <p>
                View and manage users waiting for a service.
            </p>

        </div>

    </section>


    <section class="card">

        <div class="form-group">

            <label for="queueService">
                Select Service
            </label>

            <select
                id="queueService"
                onchange="loadQueue()"
            ></select>

        </div>

    </section>


    <section class="card">

        <div class="section-header">

            <div>

                <h2 id="queueTitle">
                    Queue
                </h2>

                <p id="queueCount">
                    0 people waiting
                </p>

            </div>

            <button
                class="button primary"
                onclick="serveNext()"
            >
                Serve Next
            </button>

        </div>


        <div id="queueList"></div>

    </section>

</main>


<script src="script.js"></script>

</body>

</html>
